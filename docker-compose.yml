version: '3.8'

services:
  app:
    build: .
    container_name: laravel_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    depends_on:
      - db
    networks:
      - meal-network

  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mealplanner
      MYSQL_USER: user
      MYSQL_PASSWORD: password1
    ports:
      - "3307:3306"  # Use 3307 since 3306 was in use
    volumes:
      - mysql_data:/var/lib/mysql  # Persistent storage for MySQL
    networks:
      - meal-network

  nginx:
    image: nginx:alpine
    container_name: nginx_server
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - meal-network
  
  phpmyadmin:
    image: phpmyadmin
    container_name: phpmyadmin_db
    restart: unless-stopped
    ports:
      - "8082:80"  # Runs phpMyAdmin on port 8082
    environment:
      PMA_HOST: mysql_db  # Your MySQL container name
      MYSQL_ROOT_PASSWORD: root
    networks:
      - meal-network
  
  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"  # Web UI
      - "1025:1025"  # SMTP server
    networks:
      - meal-network

networks:
  meal-network:
    driver: bridge

volumes:
  mysql_data: